# open-logic async FIFO. UNSUPPORTED: two clocks (In_Clk, Out_Clk), kept for when they are supported.
# Expect an sby_mi FAIL on Out_Data while Out_Valid = 0: the RAM has no reset (gold 0, gate free).
top = "olo_base_fifo_async"
exercises = ["VHDL (ghdl)", "two clocks", "clock-domain crossing", "RAM", "sync resets"]

[source]
frontend = "ghdl"
args = ["--std=08", "-frelaxed"]
files = [
  "../_lib/open-logic/olo_base_pkg_array.vhd", "../_lib/open-logic/olo_base_pkg_attribute.vhd",
  "../_lib/open-logic/olo_base_pkg_math.vhd", "../_lib/open-logic/olo_base_pkg_logic.vhd",
  "../_lib/open-logic/olo_base_pkg_string.vhd", "../_lib/open-logic/olo_base_cc_reset.vhd",
  "../_lib/open-logic/olo_base_cc_bits.vhd", "../_lib/open-logic/olo_base_ram_sdp.vhd",
  "../_lib/open-logic/olo_base_fifo_async.vhd",
]

[params.Width_g]
values = [8, 16, 32, 64]
[params.Depth_g]
values = [4, 16, 32, 64, 128]

[[clocks]]
name = "In_Clk"
[[clocks]]
name = "Out_Clk"

[[resets]]
name = "In_Rst"
clock = "In_Clk"
active = 1
[[resets]]
name = "Out_Rst"
clock = "Out_Clk"
active = 1
