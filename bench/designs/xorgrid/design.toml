# Synthetic grid of XOR tiles, generated by xorgrid.py with a fixed seed. Ladders only.
top = "xorgrid"
exercises = ["Verilog (slang)", "generated design", "sync reset", "scaling: grid, control bits, routing distance"]

[source]
frontend = "slang"
generate = ["sh", "-c", "uv run --no-project --with click==8.5.0 --with numpy==2.5.4 python {design}/xorgrid.py -I {I} -O {O} -C {C} -W {W} -H {H} -F {F} -N {N} -D {D} -S {S} > {out}/xorgrid.v"]
files = ["xorgrid.v"]

[[clocks]]
name = "clk"

[[resets]]
name = "rst"
clock = "clk"
active = 1

[[ladders]]
name = "Tile Grid"
timeout = 600
