# open-logic olo_base_dyn_sft. Sources: designs/_lib/open-logic.
top = "olo_base_dyn_sft"
exercises = ["VHDL (ghdl)", "barrel shifter", "string generic", "sync reset"]

[source]
frontend = "ghdl"
args = ["--std=08", "-frelaxed"]
files = [
  "../_lib/open-logic/olo_base_pkg_array.vhd", "../_lib/open-logic/olo_base_pkg_attribute.vhd",
  "../_lib/open-logic/olo_base_pkg_math.vhd", "../_lib/open-logic/olo_base_pkg_logic.vhd",
  "../_lib/open-logic/olo_base_pkg_string.vhd", "../_lib/open-logic/olo_base_cc_reset.vhd",
  "../_lib/open-logic/olo_base_cc_bits.vhd", "../_lib/open-logic/olo_base_ram_sdp.vhd",
  "../_lib/open-logic/olo_base_dyn_sft.vhd",
]

[params.Width_g]
values = [8, 16, 32, 64]
[params.Direction_g]
values = ["LEFT", "RIGHT"]
[params.MaxShift_g]
values = [1, 2, 3, 4, 5, 6, 8, 16, 32, 64]

[points]
require = "MaxShift_g <= Width_g"

[[clocks]]
name = "Clk"

[[resets]]
name = "Rst"
clock = "Clk"
active = 1
