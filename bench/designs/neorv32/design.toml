# neorv32 CPU.
# Every input is free: the bus protocol (ack after stb) is not modelled.
top = "neorv32_cpu"
exercises = ["VHDL (ghdl)", "RISC-V core", "async active-low reset", "bus interface"]

[source]
frontend = "ghdl"
args = ["--std=08", "--work=neorv32", "-gHART_ID=0", "-gVENDOR_ID=00000000000000000000000000000000", "-gBOOT_ADDR=00000000000000000000000000000000", "-gDEBUG_PARK_ADDR=00000000000000000000000000000000", "-gDEBUG_EXC_ADDR=00000000000000000000000000000000", "-gCPU_TRACE_EN=true"]
files = [
  "src/core/neorv32_bootrom.vhd", "src/core/neorv32_bootrom_image.vhd", "src/core/neorv32_bootrom_rom.vhd", "src/core/neorv32_bus.vhd",
  "src/core/neorv32_cache.vhd", "src/core/neorv32_cache_ram.vhd", "src/core/neorv32_cfs.vhd", "src/core/neorv32_clint.vhd",
  "src/core/neorv32_cpu.vhd", "src/core/neorv32_cpu_alu.vhd", "src/core/neorv32_cpu_alu_bitmanip.vhd", "src/core/neorv32_cpu_alu_cfu.vhd",
  "src/core/neorv32_cpu_alu_cond.vhd", "src/core/neorv32_cpu_alu_crypto.vhd", "src/core/neorv32_cpu_alu_fpu.vhd", "src/core/neorv32_cpu_alu_muldiv.vhd",
  "src/core/neorv32_cpu_alu_shifter.vhd", "src/core/neorv32_cpu_control.vhd", "src/core/neorv32_cpu_counters.vhd", "src/core/neorv32_cpu_decompressor.vhd",
  "src/core/neorv32_cpu_frontend.vhd", "src/core/neorv32_cpu_hwtrig.vhd", "src/core/neorv32_cpu_lsu.vhd", "src/core/neorv32_cpu_pmp.vhd",
  "src/core/neorv32_cpu_regfile.vhd", "src/core/neorv32_cpu_trace.vhd", "src/core/neorv32_debug_auth.vhd", "src/core/neorv32_debug_dm.vhd",
  "src/core/neorv32_debug_dtm.vhd", "src/core/neorv32_dma.vhd", "src/core/neorv32_dmem.vhd", "src/core/neorv32_dmem_ram.vhd",
  "src/core/neorv32_gpio.vhd", "src/core/neorv32_gptmr.vhd", "src/core/neorv32_imem.vhd", "src/core/neorv32_imem_image.vhd",
  "src/core/neorv32_imem_ram.vhd", "src/core/neorv32_imem_rom.vhd", "src/core/neorv32_neoled.vhd", "src/core/neorv32_onewire.vhd",
  "src/core/neorv32_package.vhd", "src/core/neorv32_prim.vhd", "src/core/neorv32_pwm.vhd", "src/core/neorv32_sdi.vhd",
  "src/core/neorv32_slink.vhd", "src/core/neorv32_spi.vhd", "src/core/neorv32_sys.vhd", "src/core/neorv32_sysinfo.vhd",
  "src/core/neorv32_top.vhd", "src/core/neorv32_tracer.vhd", "src/core/neorv32_trng.vhd", "src/core/neorv32_twd.vhd",
  "src/core/neorv32_twi.vhd", "src/core/neorv32_uart.vhd", "src/core/neorv32_wdt.vhd", "src/core/neorv32_xbus.vhd",
]

[[clocks]]
name = "clk_i"

[[resets]]
name = "rstn_i"
clock = "clk_i"
active = 0

[flows.orfs]
# ORFS stops on memories over 4096 bits by default; map them to flip-flops instead
config = ["export SYNTH_MEMORY_MAX_BITS = 32768"]
