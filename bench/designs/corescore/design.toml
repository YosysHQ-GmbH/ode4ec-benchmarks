# COUNT SERV cores behind an AXI-Stream arbiter, generated by gen.py with FuseSoC. Ladders only.
top = "corescore_de10_nano"
exercises = ["Verilog (slang)", "generated design (FuseSoC)", "memories with $readmemh", "async FIFO on one clock", "active-low reset", "scaling: core count"]

[source]
frontend = "slang"
args = ["--allow-use-before-declare"]
generate = ["python3", "{design}/gen.py", "{count}", "{out}"]
flist = "files.txt"

[[clocks]]
name = "i_clk"

[[resets]]
name = "i_rst_n"
clock = "i_clk"
active = 0

[[ladders]]
name = "Instance Count"
timeout = 900
points = [
  { count = 1 },
  { count = 2 },
  { count = 3 },
  { count = 4 },
  { count = 6 },
  { count = 8 },
]
