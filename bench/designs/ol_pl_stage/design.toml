# open-logic olo_base_pl_stage. Sources: designs/_lib/open-logic.
top = "olo_base_pl_stage"
exercises = ["VHDL (ghdl)", "pipeline stage", "boolean generic", "sync reset"]

[source]
frontend = "ghdl"
args = ["--std=08", "-frelaxed"]
files = [
  "../_lib/open-logic/olo_base_pkg_array.vhd", "../_lib/open-logic/olo_base_pkg_attribute.vhd",
  "../_lib/open-logic/olo_base_pkg_math.vhd", "../_lib/open-logic/olo_base_pkg_logic.vhd",
  "../_lib/open-logic/olo_base_pkg_string.vhd", "../_lib/open-logic/olo_base_cc_reset.vhd",
  "../_lib/open-logic/olo_base_cc_bits.vhd", "../_lib/open-logic/olo_base_ram_sdp.vhd",
  "../_lib/open-logic/olo_base_pl_stage.vhd",
]

[params.Width_g]
values = [8, 16, 32, 64]
[params.Stages_g]
values = [1, 2, 3, 4, 5, 6]
[params.UseReady_g]
values = ["false", "true"]

[[clocks]]
name = "Clk"

[[resets]]
name = "Rst"
clock = "Clk"
active = 1

[[ladders]]
name = "Stages"
timeout = 30
points = [
  { Width_g = 16, Stages_g = 1, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 2, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 4, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 8, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 12, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 16, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 24, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 32, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 48, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 64, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 96, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 128, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 192, UseReady_g = "true" },
  { Width_g = 16, Stages_g = 256, UseReady_g = "true" },
]
